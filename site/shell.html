<!doctype html>
<html lang="en" class="drafted-pages" data-workspace-page="{{PAGE}}" data-workspace-ready="false">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Drafted — {{TITLE}}</title>
<meta name="description" content="Build a CV that reflects the experience you bring to the role.">
<link rel="icon" href="/assets/brand/drafted-favicon.ico" sizes="16x16 32x32">
<link rel="icon" href="/assets/brand/drafted-favicon-16.png" type="image/png" sizes="16x16">
<link rel="icon" href="/assets/brand/drafted-favicon-32.png" type="image/png" sizes="32x32">
<link rel="icon" href="/assets/brand/drafted-favicon.svg" type="image/svg+xml" sizes="any">
{{HEAD}}
<link rel="stylesheet" href="/drafted-editor.css" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="/drafted-editor.css"></noscript>
</head>
<body>
{{ENVIRONMENT}}
<div class="page-scroll">
{{HERO}}
<section id="section-input" class="section-input snap-section">
  <div class="input-left">
    <label for="job-ad-input">Job description (optional)</label>
    <textarea id="job-ad-input" rows="7" placeholder="Paste the job description…"></textarea>
    <div id="jobcontext-status" role="status"><span id="jobcontext-status-icon"></span><span id="jobcontext-status-text"></span></div>
    <div class="file-picker">
      <input id="cv-file" type="file" accept=".pdf,application/pdf">
      <button id="file-btn" class="file-btn" type="button">Choose file</button>
      <span id="file-name" class="file-name">Choose your CV</span>
    </div>
    <button id="upload-btn" type="button">Continue to editor</button>
  </div>
  <div class="input-right">
    <div class="cv-preview-box"><div class="cv-preview-wrap">
      <div id="cv-preview" class="cv-preview-embed" aria-label="Uploaded CV"></div>
      <div class="cv-preview-placeholder">Your CV preview will appear here.</div>
    </div></div>
  </div>
</section>
<main class="section-editor snap-section drafted-app" aria-label="CV editor">
  <div class="layout-container editor-container"><div class="editor-layout">
    <div class="editor-left"><div class="chat-card">
      <h1 class="chat-title">Editor</h1>
      <div class="chat-messages" role="region" aria-label="Conversation"></div>
      <div id="tailor-card" class="tailor-card"><div id="tailor-content" class="tailor-content"><button id="tailor-btn" class="tailor-btn" type="button">Tailor to job</button></div><div id="tailor-minibar" class="tailor-minibar"><div id="tailor-mini-text"></div></div></div>
      <div class="context-chip-row"><div id="context-chip" class="context-chip is-hidden"></div></div>
      <div class="chat-input-row"><div class="form-block"><div class="form-2"><div class="chat-command-bar">
        <textarea id="editor-input" class="chat-input" maxlength="5000" placeholder="Ask a question or describe a change…" aria-label="Ask a question or describe a change"></textarea>
        <button id="editor-send" class="chat-send-button" type="button" hidden aria-hidden="true">Apply</button>
        <button id="editor-chat-send" class="chat-send-button" type="button">Send</button>
      </div></div></div></div>
    </div></div>
    <div class="editor-right"><div class="cv-card">
      <div class="cv-document"><div class="cv-document-inner"><div id="editor-preview-text" class="cv-document-text"></div></div></div>
    </div></div>
  </div></div>
</main>
</div>
<noscript><p class="standalone-noscript">Enable JavaScript to upload and edit your CV. Your document has not been sent.</p></noscript>
<script src="/environment.js"></script>
<script src="/local-config.js"></script>
<script src="/drafted-editor.js" defer></script>
</body>
</html>
