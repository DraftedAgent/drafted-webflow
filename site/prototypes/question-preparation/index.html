<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Drafted · Question preparation study</title>
<style>
:root{color-scheme:light;--ink:#142e3d;--teal:#008b91;--line:#d4e2e7}*{box-sizing:border-box}body{margin:0;background:#fff;color:var(--ink);font:15px/1.5 system-ui,sans-serif}header{padding:20px 28px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:16px}header strong{font-size:22px;letter-spacing:-1px}header span{font-size:12px;color:#667d89;align-self:center}main{max-width:1040px;padding:36px 24px;margin:auto}.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:0 0 28px}button,select{font:inherit;background:white;border:1px solid #b9ced7;border-radius:6px;padding:8px 13px;color:var(--ink)}button{cursor:pointer}button:focus-visible,select:focus-visible{outline:2px solid var(--teal);outline-offset:3px}.stage{min-height:550px;display:grid;place-items:center;background:#fbfcfc;border:1px solid #e5edef;border-radius:12px;padding:28px}.card{width:100%;max-width:600px;min-height:360px;padding:24px 28px 30px;background:#f6fafa;border:1px solid #d4e2e7;border-radius:12px;box-shadow:0 3px 14px #17344206;text-align:center}.graphic{display:block;width:100%;height:auto;margin:0 auto 16px;overflow:visible}h1{font-size:23px;line-height:1.3;letter-spacing:-.035em;margin:0 0 9px}p{color:#667d89;margin:0;font-size:15px}.note{font-size:13px;margin:22px 0;max-width:720px}.graphic path,.graphic rect,.graphic line{vector-effect:non-scaling-stroke}.paper{fill:#fff;stroke:#cddce2;stroke-width:1}.type{stroke:#183847;stroke-opacity:.55;stroke-width:1.2;stroke-linecap:round}.minor{stroke-opacity:.22}.corner{fill:none;stroke:#008b91;stroke-width:1}.link{fill:none;stroke:#009c9c;stroke-width:.8}.frame{fill:#fff;stroke:#bfd9dc;stroke-width:1}.node{fill:#009d9b}.caption{fill:#78919d;font:8px monospace;letter-spacing:1.2px}@media(max-width:600px){header{padding:14px 18px}main{padding:22px 14px}.stage{padding:10px;min-height:440px}.card{padding:20px 12px 26px;min-height:310px}h1{font-size:20px}.graphic{margin-bottom:22px}.toolbar{gap:7px}button,select{font-size:13px;padding:8px 10px}}
</style>
<header><strong>Drafted<span style="color:#00bdb6">.</span></strong><span>Motion study · local prototype</span></header>
<main><div class="toolbar" aria-label="Prototype playback"><button id="pause">Pause</button><button id="replay">Replay</button><label>Speed <select id="speed"><option value="1">1× · Normal</option><option value="0.35">0.35× · Slow</option></select></label><button id="reduced" aria-pressed="false">Reduced motion</button></div>
<div class="stage"><section class="card" aria-label="Experience question preparation"><svg class="graphic" viewBox="0 0 500 248" aria-hidden="true">
<defs><linearGradient id="trail" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#02c8bb" stop-opacity="0"/><stop offset="1" stop-color="#02c8bb" stop-opacity=".085"/></linearGradient><clipPath id="paperclip"><rect x="32" y="18" width="210" height="212" rx="4"/></clipPath></defs>
<rect class="paper" x="32" y="18" width="210" height="212" rx="4"/>
<g class="type"><path d="M51 38h70 M51 46h112"/><path class="minor" d="M51 57h170"/>
<path d="M51 78h137 M51 85h153 M51 92h124"/>
<path d="M51 119h79 M51 129h150 M51 136h136 M51 143h155"/>
<path d="M51 169h91 M51 179h153 M51 186h120 M51 193h141"/>
<path class="minor" d="M51 212h170"/></g>
<g id="scan" clip-path="url(#paperclip)"><rect x="39" y="-47" width="196" height="46" fill="url(#trail)"/><path d="M39 0H235" stroke="#00a8a5" stroke-width="1"/><path d="M39 -3v6 M235 -3v6" stroke="#008b91" stroke-width="1"/></g>
<g id="regions"></g><g id="connections"></g><g id="questions"></g>
</svg><h1>Preparing your experience questions…</h1><p>This may take a moment.</p></section></div>
<p class="note">Standalone visual study at intended card size. Abstract shapes only; no CV content, generated questions or progress claims. The current Dev animation and its loading/error handling are unchanged.</p></main>
<script>
const ns='http://www.w3.org/2000/svg',make=(tag,attrs)=>{const e=document.createElementNS(ns,tag);for(const [k,v]of Object.entries(attrs))e.setAttribute(k,v);return e;};
const areas=[{x:46,y:70,w:164,h:28,t:710},{x:46,y:112,w:170,h:37,t:1260},{x:46,y:162,w:164,h:37,t:1880}];
const regions=areas.map(a=>{const g=make('g',{});g.append(make('rect',{x:a.x,y:a.y,width:a.w,height:a.h,fill:'#00b7ae','fill-opacity':'.025',stroke:'none'}),make('path',{class:'corner',d:`M${a.x} ${a.y+6}v-6h6 M${a.x+a.w-6} ${a.y}h6v6 M${a.x} ${a.y+a.h-6}v6h6 M${a.x+a.w-6} ${a.y+a.h}h6v-6`}));document.querySelector('#regions').append(g);return g;});
const routes=['M210 84H258Q266 84 266 76V64Q266 56 274 56H318','M216 130H278Q286 130 286 122V64Q286 56 294 56H318','M216 130H318','M210 180H258Q266 180 266 172V138Q266 130 274 130H318','M210 180H282Q290 180 290 188V196Q290 204 298 204H318'];
const links=routes.map(d=>{const p=make('path',{class:'link',d,pathLength:100,'stroke-dasharray':100,'stroke-dashoffset':100});document.querySelector('#connections').append(p);return p;});
const questions=[36,110,184].map((y,i)=>{const g=make('g',{});g.append(make('rect',{class:'frame',x:318,y,width:145,height:42,rx:4}),make('path',{class:'type',d:`M337 ${y+15}h102 M337 ${y+23}h${i===1?75:88} M337 ${y+31}h${i===2?91:63}`}),make('path',{class:'corner',d:`M318 ${y+7}v-7h7 M456 ${y+42}h7v-7`}),make('rect',{class:'node',x:324,y:y+13,width:2,height:4}));document.querySelector('#questions').append(g);return g;});
const clamp=x=>Math.max(0,Math.min(1,x)),smooth=x=>{x=clamp(x);return x*x*(3-2*x);};
let elapsed=0,last=null,paused=false,manualReduced=false,speed=1;const preference=matchMedia('(prefers-reduced-motion: reduce)');
function render(){const reduced=manualReduced||preference.matches,t=reduced?4400:elapsed%6400,fade=1-smooth((t-5250)/800);const sweep=document.querySelector('#scan');sweep.setAttribute('transform',`translate(0 ${27+190*smooth((t-180)/2420)})`);sweep.setAttribute('opacity',reduced?0:smooth(t/180)*(1-smooth((t-2600)/350)));
regions.forEach((g,i)=>g.setAttribute('opacity',smooth((t-areas[i].t)/200)*fade*(.7+.3*(1-smooth((t-3300)/600)))));
links.forEach((p,i)=>{const progress=smooth((t-1800-i*165)/720);p.setAttribute('stroke-dashoffset',100*(1-progress));p.setAttribute('opacity',fade*.72);});
questions.forEach((g,i)=>{const progress=smooth((t-2760-i*250)/650);g.setAttribute('opacity',progress*fade);g.setAttribute('transform',`translate(${(1-progress)*9} ${(1-progress)*(i===1?-7:7)})`);g.querySelector('.corner').setAttribute('opacity',smooth((t-3500-i*250)/160));g.querySelector('.node').setAttribute('opacity',smooth((t-3650-i*250)/140));});}
function tick(now){if(last!==null&&!paused&&!document.hidden&&!manualReduced&&!preference.matches)elapsed+=(now-last)*speed;last=now;render();requestAnimationFrame(tick);}requestAnimationFrame(tick);
document.querySelector('#pause').onclick=e=>{paused=!paused;e.target.textContent=paused?'Play':'Pause';};document.querySelector('#replay').onclick=()=>{elapsed=0;paused=false;document.querySelector('#pause').textContent='Pause';};document.querySelector('#speed').onchange=e=>speed=Number(e.target.value);document.querySelector('#reduced').onclick=e=>{manualReduced=!manualReduced;e.target.setAttribute('aria-pressed',manualReduced);};
</script></html>
